# Tool pins for this repository (frostyard core ADR-0043). mise.lock carries
# the checksums; `mise install` provisions the same versions locally and in CI.
#
# make verify needs only Node. make test builds Igloo in the GNOME 51 SDK with
# flatpak-builder, which mise cannot install: the SDK and the builder come from
# Flathub on a developer host, and from the
# ghcr.io/flathub-infra/flatpak-github-actions:gnome-51 image in CI
# (docs/adr/0002-adopt-the-repository-baseline.md).
[settings]
lockfile = true

[tools]
# The template gate (make verify) runs scripts/check-template.mjs and the Node
# tests. Node 24 LTS.
node = "24.22.2"
