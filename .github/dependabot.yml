# Each entry has 1 group with `patterns: ["*"]`, so it opens at most 1
# version-update PR for each run (frostyard/core ADR-0075). Security
# updates stay ungrouped.
version: 2
updates:
  # Bumps the pinned action SHAs and their version comments together
  # (core ADR-0021).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
