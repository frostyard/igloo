name: Flatpak

# Builds the Flatpak, with its tests, on every push and pull request, and keeps
# the bundle as an artifact. A v* tag also publishes an OCI image to
# ghcr.io/frostyard/igloo and attests its digest. The Frostyard remote
# (https://github.com/frostyard/flatpak-index) serves the latest tag only when
# this workflow attested it on a v* tag, so main pushes publish nothing.
#
# The app ID was io.github.frostyard.Igloo until it became org.frostyard.Igloo
# (core ADR-0016; docs/adr/0003-rename-the-application-id.md). Each v* tag
# also publishes the old ID once more, marked end-of-life with a rebase to the
# new ID, as the tag io.github.frostyard.Igloo of the same image, after latest
# moves. flatpak update then moves installed copies to the new ID, with their
# data.
#
# Every action is pinned to a commit SHA (core ADR-0021); Dependabot bumps the
# SHA and the version comment together.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: org.frostyard.Igloo
  PREVIOUS_APP_ID: io.github.frostyard.Igloo
  IMAGE: ghcr.io/frostyard/igloo

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # flatpak-builder sandboxes builds with bubblewrap, which needs a
    # privileged container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: org.frostyard.Igloo.json
          bundle: igloo.flatpak
          artifact-name: igloo-flatpak
          run-tests: true
          # Dependencies such as VTE come from the cache when the manifest
          # has not changed; Igloo itself always rebuilds.
          cache-key: flatpak-builder-${{ hashFiles('org.frostyard.Igloo.json') }}

      - name: Export the OCI images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir oci
          flatpak build-bundle --oci --arch=x86_64 repo oci/igloo.oci "$APP_ID"
          # The old ID, end-of-life with a rebase to the new ID: the commit
          # metadata becomes the image label
          # org.flatpak.commit-metadata.ostree.endoflife-rebase.
          flatpak build-commit-from --src-ref="app/$APP_ID/x86_64/master" \
            --end-of-life-rebase="$PREVIOUS_APP_ID=$APP_ID" \
            repo "app/$PREVIOUS_APP_ID/x86_64/master"
          flatpak build-bundle --oci --arch=x86_64 repo oci/igloo-eol.oci "$PREVIOUS_APP_ID"

      - name: Keep the OCI images for publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: igloo-oci
          path: oci
          retention-days: 1

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # GitHub-hosted on purpose: flatpak-index rejects attestations from
    # self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Optional: a fine-grained token with Actions write access to
      # frostyard/flatpak-index, so the remote refreshes right away instead of
      # at its next hourly run.
      DISPATCH_TOKEN: ${{ secrets.FLATPAK_INDEX_DISPATCH_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: igloo-oci
          path: oci

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin

      # The version and commit tags go first. latest moves only after the
      # digest is attested, so the remote never sees an unattested latest.
      - name: Push the version to GHCR
        id: push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          skopeo copy --digestfile digest oci:oci/igloo.oci "docker://$IMAGE:$VERSION"
          digest="$(cat digest)"
          skopeo copy --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:sha-${GITHUB_SHA::12}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Move latest to the attested digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: skopeo copy --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"

      # The old ID's end-of-life image goes out only after latest names the
      # new ID: an index built at any moment never offers a rebase to an ID
      # it does not list. Until its tag exists, the old ID is absent from the
      # index, and installed copies keep running. As with latest, the tag
      # that the index reads moves only after the digest is attested.
      - name: Push the old ID's end-of-life image to GHCR
        id: push-eol
        run: |
          skopeo copy --digestfile digest-eol oci:oci/igloo-eol.oci "docker://$IMAGE:sha-${GITHUB_SHA::12}-eol"
          echo "digest=$(cat digest-eol)" >> "$GITHUB_OUTPUT"

      - name: Attest the end-of-life image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-eol.outputs.digest }}

      - name: Move the old ID's tag to the attested end-of-life digest
        env:
          DIGEST: ${{ steps.push-eol.outputs.digest }}
        run: skopeo copy --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:$PREVIOUS_APP_ID"

      - name: Refresh the Frostyard remote
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
        run: gh workflow run publish.yml --repo frostyard/flatpak-index
